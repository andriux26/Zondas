name: Build firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Firmware/**'
      - 'docs/*.bin'
      - 'docs/update-info.html'
      - 'docs/version.json'
      - 'docs/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Generate automatic firmware version
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('RX_FSK/version.h')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'(version_id\s*=\s*")([^"]+)("\s*;)', text)
          if not match:
              raise SystemExit('version_id not found in RX_FSK/version.h')

          base = re.sub(r'\.\d+$', '', match.group(2))
          automatic_version = f"{base}.{os.environ['GITHUB_RUN_NUMBER']}"
          text = text[:match.start(2)] + automatic_version + text[match.end(2):]
          path.write_text(text, encoding='utf-8')
          print(f'Firmware version: {automatic_version}')
          PY

      - name: Add browser-assisted OTA endpoints
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('RX_FSK/RX_FSK.ino')
          source = path.read_text(encoding='utf-8')
          marker = '  server.reset();\n'
          if marker not in source:
              raise SystemExit('SetupAsyncServer marker not found')

          ota_code = r'''
          server.on("/api/filesystem-update", HTTP_POST,
            [](AsyncWebServerRequest *request) {
              const bool ok = !Update.hasError();
              AsyncWebServerResponse *response = request->beginResponse(
                ok ? 200 : 500,
                "application/json",
                ok ? "{\"ok\":true,\"message\":\"Filesystem written\"}" : "{\"ok\":false,\"message\":\"Filesystem update failed\"}"
              );
              response->addHeader("Connection", "close");
              request->send(response);
            },
            [](AsyncWebServerRequest *request, String filename, size_t index, uint8_t *data, size_t len, bool final) {
              if (index == 0) {
                LOG_I(TAG, "Browser filesystem OTA start: %s\n", filename.c_str());
                if (!Update.begin(UPDATE_SIZE_UNKNOWN, U_SPIFFS)) {
                  Update.printError(Serial);
                  return;
                }
              }

              if (!Update.hasError() && len > 0) {
                const size_t written = Update.write(data, len);
                if (written != len) {
                  Update.printError(Serial);
                }
              }

              if (final) {
                if (!Update.end(true)) {
                  Update.printError(Serial);
                } else {
                  LOG_I(TAG, "Browser filesystem OTA complete: %u bytes\n", index + len);
                }
              }
            }
          );

          server.on("/api/firmware-update", HTTP_POST,
            [](AsyncWebServerRequest *request) {
              const bool ok = !Update.hasError();
              AsyncWebServerResponse *response = request->beginResponse(
                ok ? 200 : 500,
                "application/json",
                ok ? "{\"ok\":true,\"message\":\"Firmware written\"}" : "{\"ok\":false,\"message\":\"Firmware update failed\"}"
              );
              response->addHeader("Connection", "close");
              request->send(response);
              if (ok) {
                delay(700);
                ESP.restart();
              }
            },
            [](AsyncWebServerRequest *request, String filename, size_t index, uint8_t *data, size_t len, bool final) {
              if (index == 0) {
                LOG_I(TAG, "Browser firmware OTA start: %s\n", filename.c_str());
                if (!Update.begin(UPDATE_SIZE_UNKNOWN, U_FLASH)) {
                  Update.printError(Serial);
                  return;
                }
              }

              if (!Update.hasError() && len > 0) {
                const size_t written = Update.write(data, len);
                if (written != len) {
                  Update.printError(Serial);
                }
              }

              if (final) {
                if (!Update.end(true)) {
                  Update.printError(Serial);
                } else {
                  LOG_I(TAG, "Browser firmware OTA complete: %u bytes\n", index + len);
                }
              }
            }
          );
          '''

          if '/api/filesystem-update' not in source:
              source = source.replace(marker, marker + ota_code, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Build firmware
        run: pio run -e ttgo-lora32 -t firmware

      - name: Prepare compiled files and manifests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil
          from datetime import datetime, timezone

          build = Path('.pio/build/ttgo-lora32')
          required = ['firmware-image.bin', 'firmware.bin', 'littlefs.bin', 'fonts.bin']
          for name in required:
              file = build / name
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'Missing build file: {file}')

          version_text = Path('RX_FSK/version.h').read_text(encoding='utf-8')
          version_match = re.search(r'version_id\s*=\s*"([^"]+)"', version_text)
          major_match = re.search(r'FS_MAJOR\s*=\s*(\d+)', version_text)
          minor_match = re.search(r'FS_MINOR\s*=\s*(\d+)', version_text)
          if not version_match or not major_match or not minor_match:
              raise SystemExit('Could not read version from RX_FSK/version.h')

          version_id = version_match.group(1)
          fs_major = int(major_match.group(1))
          fs_minor = int(minor_match.group(1))
          full_version = f'{version_id}-{chr(64 + fs_major)}{fs_minor}'
          build_date = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')

          firmware = Path('Firmware')
          docs = Path('docs')
          firmware.mkdir(exist_ok=True)
          docs.mkdir(exist_ok=True)

          files = {
              'firmware-image.bin': 'firmware-image.bin',
              'firmware.bin': 'update.ino.bin',
              'littlefs.bin': 'update.fs.bin',
              'fonts.bin': 'fonts.bin',
          }
          for source, target in files.items():
              shutil.copy2(build / source, firmware / target)
              shutil.copy2(build / source, docs / target)

          version_info = {
              'version': full_version,
              'build_date': build_date,
              'firmware': 'https://raw.githubusercontent.com/andriux26/Zondas/main/docs/update.ino.bin',
              'filesystem': 'https://raw.githubusercontent.com/andriux26/Zondas/main/docs/update.fs.bin',
          }
          version_json = json.dumps(version_info, ensure_ascii=False, indent=2) + '\n'
          (firmware / 'version.json').write_text(version_json, encoding='utf-8')
          (docs / 'version.json').write_text(version_json, encoding='utf-8')

          web_manifest = {
              'name': 'Zondas TTGO LoRa32',
              'version': full_version,
              'new_install_prompt_erase': True,
              'builds': [{
                  'chipFamily': 'ESP32',
                  'parts': [{'path': 'firmware-image.bin', 'offset': 4096}],
              }],
          }
          (docs / 'manifest.json').write_text(
              json.dumps(web_manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          (docs / 'update-info.html').write_text(
              f'<!doctype html><meta charset="utf-8"><b>Zondas firmware</b><br>Versija: {full_version}<br>Sukurta: {build_date}<br>',
              encoding='utf-8'
          )
          (docs / '.nojekyll').touch()
          print(f'Published version: {full_version}')
          PY

      - name: Save compiled firmware in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Firmware docs
          if git diff --cached --quiet; then
            echo "Firmware files unchanged"
          else
            git commit -m "Update compiled firmware"
            git push
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zondas-firmware
          path: Firmware/
          if-no-files-found: error
