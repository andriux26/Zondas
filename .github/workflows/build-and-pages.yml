name: Build firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Firmware/**'
      - 'docs/*.bin'
      - 'docs/update-info.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Build original firmware
        run: pio run -e ttgo-lora32 -t firmware

      - name: Prepare compiled files
        shell: bash
        run: |
          set -euxo pipefail
          BUILD=.pio/build/ttgo-lora32
          test -s "$BUILD/firmware-image.bin"
          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/littlefs.bin"
          test -s "$BUILD/fonts.bin"

          mkdir -p Firmware docs
          cp "$BUILD/firmware-image.bin" Firmware/firmware-image.bin
          cp "$BUILD/firmware.bin" Firmware/update.ino.bin
          cp "$BUILD/littlefs.bin" Firmware/update.fs.bin
          cp "$BUILD/fonts.bin" Firmware/fonts.bin

          cp Firmware/firmware-image.bin docs/firmware-image.bin
          cp Firmware/update.ino.bin docs/update.ino.bin
          cp Firmware/update.fs.bin docs/update.fs.bin
          cp Firmware/fonts.bin docs/fonts.bin
          printf '<!doctype html><meta charset="utf-8"><b>Zondas firmware</b><br>Build: %s<br>Commit: %.7s<br>' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SHA" > docs/update-info.html
          touch docs/.nojekyll
          ls -lh Firmware docs

      - name: Save compiled firmware in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Firmware docs
          if git diff --cached --quiet; then
            echo "Firmware files unchanged"
          else
            git commit -m "Update compiled firmware"
            git push
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zondas-firmware
          path: Firmware/
          if-no-files-found: error
