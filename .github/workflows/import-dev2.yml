name: Import dev2 into Zondas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dev2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zondas
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download source dev2 branch
        run: |
          git clone --depth 1 --branch dev2 https://github.com/andriux26/rdz_ttgo_sonde.git /tmp/source

      - name: Copy complete project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete dev2 project into Zondas"
          git push --force origin main
