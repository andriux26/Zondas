name: Import dev2 into Zondas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dev2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zondas
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download source dev2 branch
        run: |
          git clone --depth 1 --branch dev2 https://github.com/andriux26/rdz_ttgo_sonde.git /tmp/source

      - name: Copy complete project without old workflows
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            /tmp/source/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to import"
          else
            git commit -m "Import complete dev2 project into Zondas"
            git push origin main
          fi
