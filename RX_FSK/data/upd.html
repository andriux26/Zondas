<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Zondas atnaujinimas</title>
  <style>
    .ota-box{max-width:620px;margin:24px auto;padding:20px;border:1px solid #aaa;border-radius:12px}
    .ota-row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #ddd}
    .ota-status{margin:18px 0;padding:12px;border-radius:8px;background:#eee}
    .ota-button{width:100%;padding:14px;font-size:17px;cursor:pointer}
    .ota-button:disabled{opacity:.55;cursor:not-allowed}
    progress{width:100%;height:24px;margin-top:12px}
    .small{font-size:13px;opacity:.8;word-break:break-all}
  </style>
</head>
<body>
  <div class="ota-box">
    <h2>Zondas pilnas atnaujinimas</h2>

    <div class="ota-row"><span>Įdiegta versija</span><strong id="installedVersion">%FULLNAMEID%</strong></div>
    <div class="ota-row"><span>GitHub versija</span><strong id="remoteVersion">Tikrinama...</strong></div>
    <div class="ota-row"><span>Sukurta</span><strong id="buildDate">–</strong></div>

    <div id="status" class="ota-status">Tikrinama, ar yra nauja versija...</div>

    <button id="updateButton" class="ota-button" type="button" disabled>Atnaujinti programą ir web puslapius</button>
    <progress id="progress" value="0" max="100" hidden></progress>
    <div id="progressText" class="small"></div>

    <p class="small">Vienu paspaudimu atnaujinami LittleFS web failai ir pati ESP32 programa. Atnaujinimo metu neišjunk ESP.</p>
  </div>

<script>
(() => {
  const installed = document.getElementById('installedVersion').textContent.trim();
  const remoteEl = document.getElementById('remoteVersion');
  const dateEl = document.getElementById('buildDate');
  const statusEl = document.getElementById('status');
  const button = document.getElementById('updateButton');
  const progress = document.getElementById('progress');
  const progressText = document.getElementById('progressText');

  const base = 'https://raw.githubusercontent.com/andriux26/Zondas/main/docs/';
  let firmwareUrl = base + 'update.ino.bin';
  let filesystemUrl = base + 'update.fs.bin';

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function checkVersion() {
    try {
      const response = await fetch(base + 'version.json?t=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const info = await response.json();
      const remote = String(info.version || '').trim();
      if (!remote) throw new Error('version.json neturi versijos');

      remoteEl.textContent = remote;
      dateEl.textContent = info.build_date || '–';
      if (info.firmware) firmwareUrl = info.firmware;
      if (info.filesystem) filesystemUrl = info.filesystem;

      if (remote === installed) {
        setStatus('Naujausia versija jau įdiegta.');
        button.disabled = true;
      } else {
        setStatus('Yra nauja versija. Bus atnaujinta programa ir web puslapiai.');
        button.disabled = false;
      }
    } catch (error) {
      remoteEl.textContent = 'Nepavyko patikrinti';
      setStatus('Versijos patikrinimo klaida: ' + error.message);
      button.disabled = true;
    }
  }

  async function downloadFile(url, title, minimumSize) {
    progressText.textContent = 'Atsisiunčiamas ' + title + ' iš GitHub...';
    const response = await fetch(url + '?t=' + Date.now(), {cache:'no-store'});
    if (!response.ok) throw new Error(title + ' HTTP ' + response.status);
    const blob = await response.blob();
    if (blob.size < minimumSize) throw new Error(title + ' failas per mažas: ' + blob.size + ' B');
    return blob;
  }

  function uploadFile(endpoint, field, filename, blob, startPercent, endPercent, title) {
    return new Promise((resolve, reject) => {
      const form = new FormData();
      form.append(field, blob, filename);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', endpoint, true);
      xhr.upload.onprogress = event => {
        if (event.lengthComputable) {
          const ratio = event.loaded / event.total;
          progress.value = startPercent + Math.round(ratio * (endPercent - startPercent));
          progressText.textContent = title + ': ' + Math.round(event.loaded/1024) + ' / ' + Math.round(event.total/1024) + ' KB';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve();
        else reject(new Error(xhr.responseText || ('ESP HTTP ' + xhr.status)));
      };
      xhr.onerror = () => reject(new Error('Ryšys su ESP nutrūko įrašant ' + title));
      xhr.send(form);
    });
  }

  async function installUpdate() {
    button.disabled = true;
    progress.hidden = false;
    progress.value = 0;
    setStatus('Neišjunk ESP ir neuždaryk šio puslapio.');

    try {
      const filesystemBlob = await downloadFile(filesystemUrl, 'web failai', 10000);
      progress.value = 5;
      const firmwareBlob = await downloadFile(firmwareUrl, 'firmware', 100000);
      progress.value = 10;

      progressText.textContent = 'Įrašomi web puslapiai...';
      await uploadFile('/api/filesystem-update', 'filesystem', 'update.fs.bin', filesystemBlob, 10, 50, 'Web failai');

      progress.value = 50;
      progressText.textContent = 'Web puslapiai įrašyti. Įrašoma programa...';
      await uploadFile('/api/firmware-update', 'firmware', 'update.ino.bin', firmwareBlob, 50, 98, 'Firmware');

      progress.value = 100;
      progressText.textContent = 'Abu failai įrašyti. ESP persikrauna...';
      setStatus('Atnaujinimas baigtas. Po kelių sekundžių atnaujink puslapį.');
    } catch (error) {
      setStatus('Atnaujinimo klaida: ' + error.message);
      progressText.textContent = '';
      button.disabled = false;
    }
  }

  button.addEventListener('click', installUpdate);
  checkVersion();
})();
</script>
</body>
</html>
